name: Mirror to lindbohansen/baseLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-lindbohansen-baseLab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository as a bare mirror
        run: |
          git clone --bare . source-mirror.git

      - name: Mirror to lindbohansen/baseLab
        env:
          BASELAB_MIRROR_PAT: ${{ secrets.BASELAB_MIRROR_PAT }}
        run: |
          if [[ -z "${BASELAB_MIRROR_PAT}" ]]; then
            echo "Missing BASELAB_MIRROR_PAT secret." >&2
            exit 1
          fi

          cd source-mirror.git
          git remote add mirror https://x-access-token:${BASELAB_MIRROR_PAT}@github.com/lindbohansen/baseLab.git
          git push mirror +refs/heads/main:refs/heads/main
